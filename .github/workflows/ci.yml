name: Docker Build and Deploy - Smart Soft System

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_IMAGE: "chor_app_client"
  DEPLOY_DIR: "/opt/chor_app_client/"
  CONTAINER_NAME: "chor_app_client"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE .

      - name: Save Docker image
        run: |
          docker save $DOCKER_IMAGE -o $DOCKER_IMAGE.tar

      # Шаг: Настройка SSH-ключа
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary_if_strict_checking_off
          if_key_exists: replace

      # Шаг: Создание директории (используем стандартный ssh)
      - name: Create deploy directory
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "mkdir -p $DEPLOY_DIR"

      # Шаг: Копирование файлов (используем стандартный scp)
      - name: Copy files to remote server
        run: |
          scp -o StrictHostKeyChecking=no $DOCKER_IMAGE.tar docker-compose.yml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:$DEPLOY_DIR

      # Шаг: Развертывание
      - name: Deploy Docker container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            cd $DEPLOY_DIR &&
            docker load -i $DOCKER_IMAGE.tar &&
            docker compose down || true &&
            docker compose up -d &&
            docker ps | grep $CONTAINER_NAME
          "

      # Шаг: Проверка
      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            echo '=== Container Status ===' &&
            docker ps | grep $CONTAINER_NAME &&
            echo '=== Recent Logs ===' &&
            docker logs --tail 20 $CONTAINER_NAME
          "