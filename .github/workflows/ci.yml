name: Docker Build and Deploy - Smart Soft System

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  DOCKER_IMAGE: "chor_app_client"
  DEPLOY_DIR: "/opt/chor_app_client/"
  CONTAINER_NAME: "chor_app_client"

jobs:
  # Runs on every push and PR. Nothing below it deploys unless this passes.
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  build-and-deploy:
    # PRs only get the checks above - deploying needs a push to main.
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE .

      - name: Save Docker image
        run: |
          docker save $DOCKER_IMAGE -o $DOCKER_IMAGE.tar

      # Шаг: Настройка SSH-ключа
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary_if_strict_checking_off
          if_key_exists: replace

      # Шаг: Создание директории (используем стандартный ssh)
      - name: Create deploy directory
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "mkdir -p $DEPLOY_DIR"

      # Шаг: Копирование файлов (используем стандартный scp)
      - name: Copy files to remote server
        run: |
          scp -o StrictHostKeyChecking=no $DOCKER_IMAGE.tar docker-compose.yml ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:$DEPLOY_DIR

      # Шаг: Развертывание. `set -e` - любая упавшая команда (в т.ч.
      # `docker load`) валит шаг, а не перезапускает старый образ молча.
      - name: Deploy Docker container
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            set -e
            cd $DEPLOY_DIR
            docker load -i $DOCKER_IMAGE.tar
            docker compose down
            docker compose up -d
            docker ps | grep $CONTAINER_NAME
          "

      # Шаг: Проверка
      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            echo '=== Container Status ===' &&
            docker ps | grep $CONTAINER_NAME &&
            echo '=== Recent Logs ===' &&
            docker logs --tail 20 $CONTAINER_NAME
          "
