name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        # A placeholder is enough here - this just checks the app builds;
        # the real value is supplied at image-build time (see Dockerfile).
        run: npm run build
        env:
          VITE_API_URL: "http://localhost:5050"
